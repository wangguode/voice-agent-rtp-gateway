name: Build Mac & Windows Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Package Java 17 Spring Boot Backend JAR
        working-directory: java-freeswitch-rtp-bridge
        run: mvn -B -q package -DskipTests

      - name: Build Electron Desktop App (macOS .dmg / Windows .exe)
        working-directory: desktop-shell
        run: |
          npm install
          if [ "${{ runner.os }}" == "macOS" ]; then
            npm run build:mac
          else
            npm run build:win
          fi

      - name: Upload Desktop Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voice-agent-desktop-${{ matrix.os }}
          path: |
            desktop-shell/dist/*.dmg
            desktop-shell/dist/*.zip
            desktop-shell/dist/*.exe
